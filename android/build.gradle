allprojects {
    repositories {
        google()
        // Google-hosted mirror of Maven Central to avoid 404s from repo1.maven.org
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
        mavenCentral()
    }
}

// Force a resolvable version of ffmpeg-kit even if a plugin
// requests an unavailable coordinate (e.g., 6.0-1.LTS).
configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'com.arthenica' &&
                details.requested.name == 'ffmpeg-kit-full-gpl') {
            details.useVersion '6.0-2'
        }
    }
}

rootProject.buildDir = '../build'

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty("kotlin")) {
            project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).all {
                kotlinOptions {
                    jvmTarget = "1.8"
                }
            }
        }
    }
}

subprojects {
    afterEvaluate { project ->
        if (project.plugins.hasPlugin("com.android.application") ||
                project.plugins.hasPlugin("com.android.library")) {
            project.android {
                compileSdkVersion 35
            }
        }
        if (project.hasProperty('android')) {
                project.android {
                    if (namespace == null) {
                        namespace project.group
                    }
                }
            }
    }
}
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
